site_name: Portafolio de Mecatrónica
site_description: Documentación de prácticas y proyectos - IBERO Puebla
site_author: Emmanuel Justo Flores

theme:
  name: material
  language: es

  # Configuración de colores y modo oscuro/claro
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  # Funcionalidades estéticas y menú de navegación
  features:
    - navigation.tabs          # Pestañas en la barra superior
    - navigation.sections      # Organización en la barra lateral
    - navigation.top           # Botón para volver arriba
    - navigation.path          # Ruta de navegación (breadcrumbs)
    - search.suggest           # Búsqueda interactiva
    - search.highlight
    - content.code.copy        # Botón para copiar código

# Estratificación del menú vinculada a las carpetas dentro de docs/
nav:
  - Inicio: index.md
  - Sobre Mí: SobreMi.md
  - Prácticas:
      - Práctica 4: Practicas/Practica 4.md
  - Proyectos: Proyectos/
  - Reflexiones: Reflexiones/

# Extensiones para formato avanzado de texto y ecuaciones
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list

plugins:
  - search

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
